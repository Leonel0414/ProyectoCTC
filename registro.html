    </header>
    <main>
        <fieldset>

		<legend class='titulo legend'>Crea tu cuenta!</legend>
            <form id="formRegistro" class='creadorProductos admin_Card'>
                <div>
                    <label for="nombreRegistro">Nombre completo</label>
                    <input type="text" class='inputAdmin' id="nombreRegistro" minlength='2' required>
                    <p id="mensajeErrorNombreRegistro"></p>
                </div>
                <div>
                    <label for="correoRegistro">Correo electronico</label>
                    <input type="email" class='inputAdmin' id="correoRegistro" required>
                    <p id="mensajeErrorCorreoRegistro"></p>
                </div>
                <div>
                    <label for="contrasenaRegistro">Contrasena</label>
                    <input type="password" class='inputAdmin' minlength='2' id="contrasenaRegistro" required>
                    <p id="mensajeErrorContrasenaRegistro"></p>
                </div>
                <div>
                    <label for="confirmacionContrasenaRegistro">Confirmar contrasena</label>
                    <input type="password" class='inputAdmin' minlength='2' id="confirmacionContrasenaRegistro" required>
                    <p id="mensajeErrorConfirmarContrasenaRegistro"></p>
                </div>
                <div>
                    <label for="telefonoRegistro">Numero de telefono</label>
                    <input type="tel" class='inputAdmin' id="telefonoRegistro" required>
                </div>
                <div>
                    <label for="departamentoRegistro">Departamento/Provincia</label>
                    <select class='inputAdmin' id="departamentoRegistro">
                        <option value="Artigas">Artigas</option>
                        <option value="Canelones">Canelones</option>
                        <option value="Cerro Largo">Cerro Largo</option>
                        <option value="Colonia">Colonia</option>
                        <option value="Durazno">Durazno</option>
                        <option value="Flores">Flores</option>
                        <option value="Florida">Florida</option>
                        <option value="Lavalleja">Lavalleja</option>
                        <option value="Maldonado">Maldonado</option>
                        <option value="Montevideo">Montevideo</option>
                        <option value="Paysandu">Paysandu</option>
                        <option value="Rio Negro">Rio Negro</option>
                        <option value="Rivera">Rivera</option>
                        <option value="Rocha">Rocha</option>
                        <option value="Salto">Salto</option>
                        <option value="San Jose">San Jose</option>
                        <option value="Soriano">Soriano</option>
                        <option value="Tacuarembo">Tacuarembo</option>
                        <option value="Treinta y Tres">Treinta y Tres</option>
                    </select>
                </div>
                <div>
                    <label for="direccionRegistro">Direccion</label>
                    <input type="text" class='inputAdmin' minlength='6' id="direccionRegistro" required>
                </div>
                <p id="mensajeError"></p>
                <div>
                    <button type="button" class='boton' id="btnRegistrar">Crear cuenta</button>
                </div>
            </form>
        </fieldset>
    </main>
    <footer></footer>
